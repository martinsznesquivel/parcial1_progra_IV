<div class="login-container">
    <h2>Iniciar sesión</h2>

    <form [formGroup]="formulario" (ngSubmit)="accion()">

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                formControlName="email"
                placeholder="ejemplo@correo.com">

                @if(formulario.get('email')?.errors?.['required']) { <small> El email es obligatorio </small>}
                @if(formulario.get('email')?.errors?.['email']) { <small> El formato no es válido </small> }
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                formControlName="password"
                placeholder="tu contraseña">

                @if (formulario.get('password')?.invalid && formulario.get('password')?.touched) { <small> La contraseña es obligatoria </small> }

        </div>

        <button type="submit" [disabled]="formulario.invalid">Ingresar</button>
    </form>
</div>
